<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Delete Contact</title>
  </head>

  <body>
    <header class="header">
      <a href="../dashboard.html" class="logo">
        <img
          src="../assests/images/logo.png"
          alt=""
          height="70px"
          width="70px"
        />
      </a>
    </header>

    <main class="container">
      <section class="contact-details-card-sec">
        <div class="card-sec-head">
          <h2>Delete Contact ?</h2>
        </div>

        <div class="delete-small-card">
          <p>Are you sure you want to delete this contact?</p>
        </div>

        <div>
          <form action="../contact/contacts-detail.html">
            <button type="submit" class="contact-back-btn">Cancel</button>
          </form>

          <form action="../contact/contacts-main.html">
            <button type="submit" class="contact-dlt-btn">Delete</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
